name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller kokoro-onnx
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build app + installer
        shell: cmd
        run: build_installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-installer
          path: dist/LocalPilot-Setup-*.exe
